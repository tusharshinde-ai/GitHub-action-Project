name: CICD

on: 
 workflow_dispatch: 
  inputs:
    environment:
      description: This is the evnironment value where this workflow runs
      default: 'dev'
      required: true
      type: choice
      options:
        - dev
        - prod
        - staging

jobs:

  code:
   if: inputs.environment == 'dev'
   runs-on: ubuntu-latest
   steps:
     - name: checkout code
       run: echo "code clone rom GitHub"
  build:
   needs: code
   runs-on: ubuntu-latest
   steps:
     - name: Build docker container
       run: echo "Docker Builder Build"
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing the container"
  deploy:
   needs: test
   runs-on: ubuntu-latest
   steps:
     - name: Deploying the app
       run: echo "Docker compose deployed the app"
  
  
