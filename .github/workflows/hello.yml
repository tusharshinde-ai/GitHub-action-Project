name: Hello

on:
  push: 
    branches: [main]

jobs:
  greet:
    runs-on:
      - ubuntu-latest
    steps:
      - name: say hello to users 
        run: echo "Hello Friends"

      - name: say hello to username
        run: echo "hello $USER"
  defaults:
    runs-on: ubuntu-latest
    steps:
      - name: who what is a version of my python & docker application
        run: docker --version && python --version
